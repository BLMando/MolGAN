data:
  data_file: data/helpdesk_parsed.xes
  max_activities: 12                  # Aumentato da 6 a 12 per tracce più lunghe
  validation_split: 0.15
  test_split: 0.1

model:
  z_dim: 128                           # Aumentato da 64 a 128 per maggiore capacità
  decoder_units: (128, 256, 512, 256, 128) # Architettura encoder-decoder simmetrica
  discriminator_units: (128, 256, 128)     # Aggiunto layer intermedio per feature extraction
  mlp_units: 128
  dropout_rate: 0.1                   # Regolarizzazione moderata
  use_lstm_architecture: false
  use_simplified_lstm_architecture: false

  # LSTM-specific parameters (used when use_lstm_architecture: true)
  lstm_hidden_dim: 256                # Hidden dimension for LSTM layers
  lstm_num_layers: 2                  # Number of LSTM layers

training:
  batch_size: 128                      # Ridotto da 512 per stabilità su dataset piccoli
  epochs: 150
  learning_rate: !!float 5e-5          # Più conservative (era 1e-4)
  learning_rate_D: !!float 2e-4        # Ridotto da 5e-4
  learning_rate_V: !!float 5e-5        # Più conservative (era 1e-4)
  n_critic: 5
  gradient_penalty_weight: 10.0
  use_batch_grouping: false            # Set to true per raggruppare batch per lunghezza (riduce padding)
  use_balanced_sampling: true          # Set to true per sampling bilanciato tra diverse lunghezze (migliora diversità)
  
  # ─────────────────────────────────────────────────────────
  # Gumbel-Softmax
  # ─────────────────────────────────────────────────────────
  temperature_start: 5.0
  temperature_end: 0.5
  temperature_decay: 0.98             # Più graduale (era 0.96) per exploration più lunga             
  
  # ─────────────────────────────────────────────────────────
  # GAN/RL Mixing
  # ─────────────────────────────────────────────────────────
  lambda_start: 0.6                   # 0.6→1.0: PURE GAN per primi 50 epochs
  lambda_end: 0.2                     
  lambda_decay_start: 10              
  
  # ─────────────────────────────────────────────────────────
  # Early Stopping
  # ─────────────────────────────────────────────────────────
  early_stopping_patience: 20         
  early_stopping_metric: valid_rate   # reward_mean→valid_rate (metrica primaria)
  early_stopping_threshold: 0.85      

# ─────────────────────────────────────────────────────────
# Reward Function
# ─────────────────────────────────────────────────────────
reward:
  use_rl: true
  
  # Phase 1: Epochs 0-50 (VALIDITY FOCUS)
  weights_early:
    validity: 0.85        # Aumentato da 0.80 (fitness eliminato)
    fitness: 0.10         # Eliminato (da note.md: "fitness non ci interessa")
    conformance: 0.00     # Aumentato da 0.05
    diversity: 0.05       # Aggiunto (era 0.00)       
  
  # Phase 2: Epochs 50+ (BALANCED)
  weights_late:
    validity: 0.50        # Aumentato da 0.40 (fitness ridistribuito)
    fitness: 0.30         # Eliminato (da note.md: "fitness non ci interessa")
    conformance: 0.00     # Aumentato da 0.20
    diversity: 0.20       # Aumentato da 0.10       
  
  transition_epoch: 50    # Epoca di transizione tra early/late


evaluation:
  n_samples_eval: 300     # Numero di tracce generate per valutazione
  eval_freq: 5            # Valutazione ogni 5 epochs

output:
  save_dir: checkpoints/process_gan
  save_every: 10
  log_every: 1
  log_dir: results/logs