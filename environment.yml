name: ProcessGAN
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python=3.10
  
  - pip

  # Numerical Computing
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - scikit-learn>=1.3

  # Visualization
  - matplotlib>=3.7
  - seaborn>=0.12

  # Jupyter
  - jupyter>=1.0
  - jupyterlab>=4.0
  - ipython>=8.0

  # Chemistry (for potential RDKit integration, optional)
  # - rdkit>=2023  # Uncomment if needed for molecule-related work

  # Utilities
  - tqdm>=4.65
  - pyyaml>=6.0

  - tensorboard>=2.20.0

  # Pip packages (Process Mining specific)
  - pip:
    - pm4py>=2.7.11           # Process mining toolkit
    - graphviz>=0.20          # Process model visualization
    - python-louvain>=0.16    # Community detection for process graphs
    - networkx>=3.0           # Graph manipulation
    - plotly>=5.0             # Interactive web-based visualizations
    - kaleido>=0.2            # Static image export for Plotly
    - tensorflow==2.15
    - keras==2.15
