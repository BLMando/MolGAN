data:
  data_file: data/helpdesk_parsed.xes
  max_activities: 10                  # Aumentato da 6 a 10 (95° percentile Helpdesk)
  validation_split: 0.15
  test_split: 0.1

model:
  z_dim: 64                           
  decoder_units: (128, 256, 256, 128) # Aggiunto layer finale, struttura simmetrica
  discriminator_units: (128, 128)     
  mlp_units: 128                      
  dropout_rate: 0.1                   # Regolarizzazione moderata

training:
  batch_size: 32                      
  epochs: 1                        
  learning_rate: 0.00005                 
  n_critic: 5                         
  gradient_penalty_weight: 10.0
  
  # ─────────────────────────────────────────────────────────
  # Gumbel-Softmax
  # ─────────────────────────────────────────────────────────
  temperature_start: 5.0              
  temperature_end: 0.5                
  temperature_decay: 0.96             
  
  # ─────────────────────────────────────────────────────────
  # GAN/RL Mixing
  # ─────────────────────────────────────────────────────────
  lambda_start: 1.0                   # 0.6→1.0: PURE GAN per primi 50 epochs
  lambda_end: 0.2                     
  lambda_decay_start: 50              
  
  # ─────────────────────────────────────────────────────────
  # Early Stopping
  # ─────────────────────────────────────────────────────────
  early_stopping_patience: 20         
  early_stopping_metric: valid_rate   # reward_mean→valid_rate (metrica primaria)
  early_stopping_threshold: 0.85      

# ─────────────────────────────────────────────────────────
# Reward Function
# ─────────────────────────────────────────────────────────
reward:
  use_rl: true
  
  # Phase 1: Epochs 0-50 (VALIDITY FOCUS)
  weights_early:
    validity: 0.80        
    fitness: 0.15         
    conformance: 0.05     
    diversity: 0.00       
  
  # Phase 2: Epochs 50+ (BALANCED)
  weights_late:
    validity: 0.40        
    fitness: 0.30         
    conformance: 0.20     
    diversity: 0.10       
  
  transition_epoch: 50    # Epoca di transizione tra early/late


evaluation:
  n_samples_eval: 300     # Numero di tracce generate per valutazione
  eval_freq: 5            # Valutazione ogni 5 epochs

output:
  save_dir: checkpoints/process_gan
  save_every: 10
  log_every: 1
  log_dir: results/logs